<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Descrições IA</title>
    <!-- Importando o Tailwind CSS direto da internet para deixar bonito automático -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-8">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Copywriter IA 🤖</h1>
            <p class="text-gray-500">Gere descrições comerciais de alta conversão em segundos.</p>
        </div>

        <!-- Formulário de Entrada -->
        <div class="space-y-4 mb-8">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Produto</label>
                <input type="text" id="nomeProduto" placeholder="Ex: Tênis CloudStep Pro" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Características (Opcional)</label>
                <textarea id="caracteristicasProduto" rows="3" placeholder="Ex: Cor preta, solado macio, ideal para corrida..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></textarea>
            </div>

            <button id="btnGerar" onclick="gerarDescricao()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all flex justify-center items-center">
                <span id="btnTexto">✨ Gerar Descrição Mágica</span>
            </button>
        </div>

        <!-- Área de Resultado (Escondida por padrão) -->
        <div id="areaResultado" class="hidden border-t pt-6 mt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Resultado:</h2>
            
            <div class="bg-blue-50 rounded-lg p-4 mb-4">
                <span class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1 block">Categoria</span>
                <p id="resCategoria" class="text-gray-800 font-medium"></p>
            </div>

            <div class="bg-gray-50 rounded-lg p-4 mb-4 border border-gray-100">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">Descrição Comercial</span>
                <p id="resDescricao" class="text-gray-700 leading-relaxed"></p>
            </div>

            <div class="mb-2">
                <span class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">Tags para SEO</span>
                <div id="resTags" class="flex flex-wrap gap-2">
                    <!-- As tags vão aparecer aqui como botõezinhos -->
                </div>
            </div>
            
            <p id="resIdBanco" class="text-xs text-green-600 mt-4 text-right font-medium"></p>
        </div>

    </div>

    <!-- O "Motor" JavaScript que liga a tela com o nosso Python -->
    <script>
        async function gerarDescricao() {
            // 1. Pega o que o usuário digitou
            const nome = document.getElementById('nomeProduto').value;
            const caracteristicas = document.getElementById('caracteristicasProduto').value;

            if (!nome) {
                alert("Por favor, digite pelo menos o nome do produto!");
                return;
            }

            // 2. Muda o botão para "Carregando..."
            const btn = document.getElementById('btnGerar');
            const btnTexto = document.getElementById('btnTexto');
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btnTexto.innerText = "⏳ A IA está pensando...";

            try {
                // 3. Faz o pedido (Bate na porta do nosso FastAPI)
                const resposta = await fetch("https://meu-motor-ia.onrender.com/gerar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: nome,
                        caracteristicas: caracteristicas
                    })
                });

                const dados = await resposta.json();
                
                // Transforma o texto que veio da IA de volta para um Objeto de verdade
                const iaJSON = JSON.parse(dados.resposta_da_ia);

                // 4. Mostra os dados na tela
                document.getElementById('resCategoria').innerText = iaJSON.categoria;
                document.getElementById('resDescricao').innerText = iaJSON.descricao;
                document.getElementById('resIdBanco').innerText = `✓ Salvo no banco de dados (ID: ${dados.id_salvo_no_banco})`;

                // Limpa e cria as tags bonitinhas
                const areaTags = document.getElementById('resTags');
                areaTags.innerHTML = ''; 
                iaJSON.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = "bg-gray-200 text-gray-700 text-sm px-3 py-1 rounded-full";
                    span.innerText = tag;
                    areaTags.appendChild(span);
                });

                // Revela a área de resultado
                document.getElementById('areaResultado').classList.remove('hidden');

            } catch (erro) {
                alert("Deu um erro! O servidor Python está ligado e o CORS configurado?");
                console.error(erro);
            } finally {
                // 5. Volta o botão ao normal
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btnTexto.innerText = "✨ Gerar Nova Descrição";
            }
        }
    </script>
</body>
</html>
